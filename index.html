<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LOVÉRA — Digital Invitation Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0d0907; --bg2:#1a120e; --line:rgba(217,195,165,.28);
  --gold1:#f0e0c8; --gold2:#cdb08c; --gold3:#8f7357; --ink:#d9c3a5; --muted:#9a8670;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;overflow-x:hidden;}
.gold{background:linear-gradient(135deg,var(--gold1) 0%,var(--gold2) 45%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* hero: the logo image is the background of the first section only */
.hero-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  transition:opacity .9s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),filter .9s ease;animation:bgin 1.8s ease backwards}
.hero-bg::before{content:"";position:absolute;left:50%;top:46%;width:min(150vw,130vh);aspect-ratio:1;transform:translate(-50%,-50%);
  background:url(hero.jpg) center/cover no-repeat;
  -webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
header{position:relative;z-index:1;height:100svh;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:24px 24px calc(44px + env(safe-area-inset-bottom,0px));
  transition:opacity .7s ease,transform .9s ease}
.cta{display:inline-block;padding:13px 34px;border:1px solid var(--gold3);color:var(--gold1);text-decoration:none;font-size:12px;letter-spacing:.3em;text-transform:uppercase;border-radius:999px;background:rgba(13,9,7,.35);backdrop-filter:blur(6px);transition:background .3s,color .3s}
.cta:hover,.cta:focus-visible{background:var(--gold2);color:var(--bg);outline:none}
body.away .hero-bg{opacity:0;transform:scale(1.14);filter:blur(8px)}
body.away header{opacity:0;transform:translateY(24px)}
.after{position:relative;z-index:1;background:var(--bg);
  background-image:radial-gradient(900px 500px at 80% 0%,rgba(205,176,140,.12),transparent 60%),radial-gradient(700px 500px at 0% 40%,rgba(143,115,87,.08),transparent 60%)}
@keyframes bgin{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}

/* gallery */
main{max-width:1180px;margin:0 auto;padding:40px 20px 90px}
.head{text-align:center;margin-bottom:44px}
.head h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,8vw,48px);letter-spacing:.03em}
.head p{color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px}
.card{display:block;text-decoration:none;color:inherit;text-align:center}
.frame{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:140px 140px 6px 6px;padding:9px;background:var(--bg2);transition:border-color .4s,transform .4s}
.shot{position:relative;width:100%;height:100%;border-radius:132px 132px 2px 2px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,#2a1d15,#120c09 70%)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.shot .ph{font-family:var(--serif);font-size:54px;letter-spacing:-.04em;opacity:.9}
.shot::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(13,9,7,.75));opacity:0;transition:opacity .4s}
.go{position:absolute;z-index:2;left:50%;bottom:24px;width:52px;height:52px;margin-left:-26px;border-radius:50%;display:block;color:#1a120e;
  background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5);
  opacity:0;transform:translateY(18px) scale(.55);transition:opacity .35s,transform .5s cubic-bezier(.2,.9,.3,1.3)}
.go::before{content:"";position:absolute;inset:-7px;border:1px solid var(--gold2);border-radius:50%;opacity:0}
.go svg{position:absolute;inset:0;margin:auto;width:19px;height:19px;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.go .star{fill:currentColor}
.go .arrow{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:translate(-10px,10px)}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.card:hover .go .star,.card:focus-visible .go .star{opacity:0;transform:rotate(120deg) scale(.3)}
.card:hover .go .arrow,.card:focus-visible .go .arrow{opacity:1;transform:none}
.card:hover .go::before,.card:focus-visible .go::before{animation:ring 1.7s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(.92)}to{opacity:0;transform:scale(1.55)}}
.card:hover .frame,.card:focus-visible .frame{border-color:var(--gold2);transform:translateY(-6px)}
.card:hover .shot::after,.card:focus-visible .shot::after{opacity:1}
.card:focus-visible{outline:none}
.card h3{font-family:var(--serif);font-weight:400;font-size:26px;margin-top:18px;line-height:1.15}
.card small{display:block;color:var(--muted);font-size:13px;letter-spacing:.08em;margin-top:2px}
@media(hover:none){.shot::after{opacity:1}.go{opacity:1;transform:none}}

footer{border-top:1px solid var(--line);text-align:center;padding:48px 20px 56px}
footer .brand{font-family:var(--serif);font-size:30px;letter-spacing:.1em}
footer p{color:var(--muted);font-size:13px;margin-top:6px}
.dev{margin-top:26px !important;font-size:12px !important;letter-spacing:.14em}
footer a{color:var(--gold2);text-decoration:none;border-bottom:1px solid var(--gold3)}

.footer-brand{text-align:center;margin-bottom:24px}
.brand-tagline{font-size:10px;letter-spacing:3px;color:#c8b89b;margin:8px 0 5px;text-transform:uppercase}
.brand-description{font-size:11px;letter-spacing:.5px;color:#a7a197;margin:0;font-weight:300;font-style:italic}
.social{display:flex;gap:14px;justify-content:center;margin-top:24px}
.social a{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold3);display:grid;place-items:center;color:var(--gold1);border-bottom:1px solid var(--gold3);transition:background .3s,color .3s,transform .3s}
.social a:hover,.social a:focus-visible{background:var(--gold2);color:var(--bg);transform:translateY(-3px);outline:none}
.social svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){.hero-bg,header{transition-duration:.01s;animation:none}}
</style>
</head>
<body>

<div class="hero-bg" aria-hidden="true"></div>
<header id="hero">
  <a class="cta" href="#collection">See our work</a>
</header>
<div class="after">

<main id="collection">
  <div class="head">
    <h2 class="gold">The Collection</h2>
    <p>Tap an invitation to open the live site.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="footer-brand">
    <div class="brand gold">LOVÉRA</div>
    <p class="brand-tagline">LUXURY DIGITAL INVITATIONS</p>
    <p class="brand-description">Every Moment Deserves Elegance.</p>
  </div>
  <p>Want your own invitation website? <a href="#" id="contact" target="_blank" rel="noopener">Message us on WhatsApp</a></p>
  <div class="social">
    <a href="https://www.instagram.com/lovera.studios?mdxt=MnlsN3kwMHkxbGo1" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg>
    </a>
    <a href="https://www.tiktok.com/@lovera.studio" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2 4.2 5 4.5"/></svg>
    </a>
  </div>
  <p class="dev">Developed by <a href="https://www.linkedin.com/in/yousseif-saif" target="_blank" rel="noopener">Yousseif Saif</a></p>
</footer>
</div>


<script>
/* ===== Edit here: one entry per invitation website =====
   name:  card title
   style: short description (theme, season, mood)
   url:   link to the live invitation site
   image: cover image (path or link). Leave "" to show a monogram placeholder */
const invitations = [
  { name:"Ahmed & Nermin",  style:"",           url:"https://engagementinvitation.engagmentinvitation.workers.dev/#", image:"2.png" },
  { name:"Omar & Mariam",   style:"",  url:"https://engagement.prcomputer2.workers.dev/", image:"1.png" },
  { name:"",  style:"",         url:"#", image:"" },
  { name:"",  style:"",         url:"#", image:"" },
  { name:"",  style:"",         url:"#", image:"" },
];
const CONTACT_LINK = "https://wa.me/201070613611";

const grid = document.getElementById("grid");
invitations.forEach(function(it){
  const a = document.createElement("a");
  a.className = "card";
  a.href = it.url; a.target = "_blank"; a.rel = "noopener";
  a.setAttribute("aria-label", it.name + " — open invitation");
  const initials = it.name.split(/[^A-Za-zÀ-ÿ]+/).filter(Boolean).filter(function(w,i){return i%2===0}).map(function(w){return w[0]}).join("&");
  a.innerHTML = '<div class="frame"><div class="shot">' +
    (it.image ? '<img loading="lazy" alt="" src="'+it.image+'">' : '<span class="ph gold">'+initials+'</span>') +
    '<span class="go" aria-hidden="true"><svg class="star" viewBox="0 0 16 16"><path d="M8 0 9.6 6.4 16 8 9.6 9.6 8 16 6.4 9.6 0 8 6.4 6.4Z"/></svg><svg class="arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8.5 7H17v8.5"/></svg></span>' +
    '</div></div><h3></h3><small></small>';
  a.querySelector("h3").textContent = it.name;
  a.querySelector("small").textContent = it.style;
  grid.appendChild(a);
});
document.getElementById("contact").href = CONTACT_LINK;

/* hide the hero background on scroll, bring it back when returning to the top */
(function(){
  var hero=document.getElementById("hero");
  function update(){document.body.classList.toggle("away", window.scrollY > hero.offsetHeight*0.2);}
  window.addEventListener("scroll",update,{passive:true});
  window.addEventListener("resize",update);
  update();
})();
</script>
</body>
</html>
